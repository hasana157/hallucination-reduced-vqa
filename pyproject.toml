[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hallucination-reduced-vqa"
version = "1.0.0"
description = "Parameter-efficient hallucination reduction for VLMs using QLoRA, RAG, and VCD"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hasan" }]
keywords = [
    "visual-question-answering",
    "hallucination",
    "qlora",
    "retrieval-augmented-generation",
    "vision-language-models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.1",
    "transformers>=4.36.2",
    "huggingface-hub>=0.19.0",
    "datasets>=2.14.0",
    "accelerate>=0.25.0",
    "peft>=0.6.0",
    "bitsandbytes>=0.41.2",
    "faiss-cpu>=1.7.4",
    "Pillow>=10.1.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.7.0",
]

[project.urls]
Repository = "https://github.com/hasana157/hallucination-reduced-vqa"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
